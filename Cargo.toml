[package]
name = "mterm"
version = "0.7.3"
edition = "2021"
authors = ["MTerm contributors"]
description = "A lightweight FinalShell-style SSH/terminal client written in Rust + Slint"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cbozuo/MTerm"
readme = "README.md"
rust-version = "1.92"

# 包名保持小写 `mterm`（翻译域、日志 target、Linux 资源命名都取它）；
# 发布的 Windows 二进制用 bin 名定为 MTerm.exe。两处要一起理解。
#
# lib + bin 分离（主流 Rust 二进制组织方式）：顶层模块清单与启动流程
# 在 src/lib.rs（lib 目标），src/main.rs 只做全局分配器注册 + 转发。
# 集成测试与文档走 `use mterm::…`，不必再经 bin 目标。
[lib]
name = "mterm"
path = "src/lib.rs"

[[bin]]
name = "MTerm"
path = "src/main.rs"

[dependencies]
# compat-1-2 removed (#compat-1-2-cleanup): in 1.18 it is an empty feature
# plus linuxkms-only pass-through (libseat/libinput) — nothing this Windows
# winit build ever compiles. Default features already cover everything used.
slint = { version = "1.18.1" }

# ICU4X (pulled in by Slint's text layout) spams stderr with raw `eprintln!`
# ("ICU4X data error: No segmentation model for language: ja") because its
# `log` shim falls back to eprintln when the `logging` feature is off. Turning
# `logging` on routes those through the real `log` crate 鈫?our tracing
# subscriber, where init_tracing silences the `icu_provider` target.
icu_provider = { version = "2", features = ["logging"] }
# Direct access to the winit window/events (OS file-drop for drag-and-drop upload).
# Must match the version vendored under vendor/i-slint-backend-winit ([patch] below).
i-slint-backend-winit = "1.18.1"
# Raw HWND access (matches winit's rwh 0.6) for the Win11 rounded-corner + shadow
# DWM tweaks on the frameless window (#162 / #166). Only used under cfg(windows).
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
glob = "0.3"
encoding_rs = "0.8"
anyhow = "1"
thiserror = "1"
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.33"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "net", "time", "fs"] }
# Pinned to 0.49: RUSTSEC-2026-0154 (an unbounded-allocation DoS in russh's
# ssh-AGENT frame parsing) is fixed only in >= 0.60.3, which drags in pre-release
# crypto crates (ed25519-dalek 3.0.0-pre, aes-gcm 0.11.0-rc, 鈥?. mterm never
# uses the ssh-agent, so the advisory is not reachable here 鈥?see audit.toml.
# Revisit the upgrade once russh's deps leave the -rc channel (cf. PR #151).
russh = "0.49"
russh-keys = "0.49"
ssh-key = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
async-trait = "0.1"
futures = "0.3"
vt100 = "0.16.2"
portable-pty = "0.8"
# East Asian width detection for terminal copy/find column math. Pinned to the
# same version vt100 uses so "is this glyph 2 cells wide?" agrees with how vt100
# lays CJK glyphs on the grid 鈥?otherwise selection/find columns drift (#132).
unicode-width = "0.1.14"
# Split terminal output into complete emoji grapheme clusters (ZWJ sequences,
# flags, skin tones, variation selectors) before replacing them with images.
unicode-segmentation = "1.12"
# Slint's software/femtovg text rasterizers flatten color-font glyphs to a
# monochrome mask. Embedded 72px Twemoji PNGs keep emoji colored on every
# renderer without switching the whole Windows application to Skia (#269).
twemoji-assets = { version = "1.5", default-features = false, features = ["png"] }
russh-sftp = "2"
rfd = "0.15"
arboard = "3"
# Zeroes password buffers on drop so plaintext credentials don't linger in
# freed heap memory (core dumps / debuggers / /proc/pid/mem).
zeroize = "1"
# SOCKS5 proxy tunnelling for SSH/SFTP in network-restricted environments.
# (HTTP CONNECT proxies are handled in src/proxy.rs without an extra crate.)
tokio-socks = "0.5"
base64 = "0.22"
# Native PuTTY PPK v2/v3 private-key loading (#281). Conversion stays entirely
# in memory: AES-CBC decrypts encrypted key blobs, Argon2 handles PPKv3 key
# derivation, and HMAC verifies the file before it reaches the SSH parser.
aes = "0.8"
argon2 = "0.5"
cbc = "0.1"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
# FinalShell connection exports derive a DES key with MD5 using java.util.Random.
des = "0.8"
md5 = "0.7"
# Enumerate installed system fonts for the Interface (font) settings picker
# and for the font-chain resolver (UI sans / terminal mono default).
fontdb = "0.16"
# Glyph-coverage probe for the font chain (#114/#129): fontdb finding a family
# is no guarantee its face draws the glyphs we need, so the resolver checks the
# matched face's cmap before committing. Same 0.44 copy Slint's fontique already
# pulls in — this adds no new compiled code.
skrifa = "0.44"
# Cross-platform serial port access for the Serial session type (#14, #17).
# Opens COM3 / /dev/ttyUSB0 etc.; on Linux the default `libudev` feature is
# used for port enumeration (CI installs libudev-dev).
serialport = "4"
# ChaCha20-Poly1305 AEAD for encrypting passwords at rest in sessions.json.
# rand (OsRng) and base64 are already pulled in by other deps above.
chacha20poly1305 = "0.10"
# Detect whether the OS is running in dark or light mode.
# Used on startup to honour the system preference before the user overrides it.
dark-light = "1"

# Lightweight synchronous HTTPS client (bundled rustls, no OpenSSL) for the
# WebDAV session-sync feature (src/app/webdav.rs). Runs on background threads;
# failures surface as in-app errors.
ureq = { version = "2", features = ["tls"] }

# Image decoding: custom wallpapers (PNG/JPEG/WebP/BMP) for the immersive theme,
# and the embedded PNG window icon on Linux. On Windows the icon comes from the
# .ico embedded by winresource at link time; on macOS from the app bundle.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }

# 内置远程桌面客户端协议栈（#rdp-vnc-embedded）。同一协议有两种「打开方式」：
# 系统客户端（mstsc / xfreerdp，行为不变）与内置客户端（Tab 内，由 MTerm 自己
# 说协议）。ironrdp 负责内置 RDP 客户端；vnc-rs 负责内置 VNC 客户端。
# 版本与参考实现对齐；**但调用方式不能照搬** —— ironrdp 0.17 删了
# `RdpOutputEvent::DesktopUpdate`、无 `ServerCertificateVerifier` trait；
# vnc-rs 侧 rustterm 用的是 fork 版，其 `VncLimits` / `VncSecurityPolicy` /
# `VncServerKey` 三个私有类型在上游两版都不存在。可移植的是协议状态机与输入
# 编解码；帧输出消费、证书信任、认证方式选择需按当前 API 重写。详见
# docs/rdp-vnc-port-prd.md §7.1.1。
#
# vnc-rs 选 0.6 而非 0.5.3：实测 0.6 是 0.5.3 的**严格超集**（公开类型 15→20），
# `ClientKeyEvent`/`ClientMouseEvent` 逐字段相同、`VncConnector` 7 个 builder 签名
# 全一致 → 升级零适配成本，且白拿 `DesktopLayout`/`DesktopUpdate`/`ResizeError`
# （动态分辨率）。0.5.3 不提供 0.6 做不到的任何能力。
#
# `rustls` 是必需而非可选：ironrdp-tls 没有默认后端，不选一个会在依赖图里触发
# compile_error。
#
# ⚠️ 注意：**ironrdp 这条链引入的是 `aws-lc-rs`，不是 ring** —— 链路为
# `ironrdp/rustls → ironrdp-client/rustls → ironrdp-tls/rustls`，而
# `ironrdp-tls` 的 rustls = ["rustls-aws-lc-rs"]。因此 `Cargo.lock` 里
# `aws-lc-rs` 与 `ring` **两者都在**：ring 是 MTerm 原有依赖（russh/sha1），
# aws-lc-rs 是本次新增。**不要再写"不引入第二套 TLS 栈"** —— 事实上引入了，
# 体积上多一个 aws-lc-rs 静态库。功能无影响（已实测可编译）。
#
# 下面 `tokio-rustls` / `rustls` 这两个**直接依赖**确实与已有 `ureq` 共享同一
# 份 crate（同为 ring provider），这部分没有重复编译。
#
# 没开 `cliprdr`/`client-clipboard`：P0 不做剪贴板重定向，而它会拖入各平台
# 剪贴板后端。
# `session` 只是为了拿到 `ironrdp::session::{GracefulDisconnectReason, …}`
# 的再导出（RDP 会话结束时用它把「服务端断开 / 远端用户断开」翻成人话，
# #remote-reconnect 2026-10-13）。该 crate 本就是 `client` 的依赖，feature
# 只开再导出，不会多编一份。
ironrdp = { version = "0.17.0", default-features = false, features = ["client", "connector", "core", "input", "pdu", "rustls", "session"] }
vnc-rs = "0.6"
# 内置 RDP 的证书信任（P0-12）。ironrdp 0.17 **没有**暴露证书校验器钩子
# （ironrdp-tls 的 upgrade() 内部硬编码 NoCertificateVerification），所以信任
# 决策只能自己做：正式连接前先用 tokio-rustls 握手一次取到服务器证书，走完信任
# 流程，通过了才让 ironrdp 建正式连接。这几个 crate 已在依赖树里（ureq →
# rustls，同为 ring provider），加直接依赖不会多编一份。
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
x509-cert = { version = "0.2", features = ["pem"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Native Wayland clipboard (wlr-data-control protocol) so copy/paste works on
# Wayland sessions (KDE/wlroots) without relying on XWayland (issue #47).
# Feature is additive over the base `arboard = "3"` dependency above.
arboard = { version = "3", features = ["wayland-data-control"] }

# Use jemalloc on Unix-like desktop/mobile targets. Unsupported targets keep
# Rust's portable System allocator without pulling in platform dependencies.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "ios", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd", target_os = "dragonfly"))'.dependencies]
jemallocator = "0.5"

# Compile the Skia renderer in *only* on macOS (feature is additive over the base
# slint dependency) so users can opt into it at launch with SLINT_BACKEND=winit-skia.
# The default stays femtovg 鈥?see the renderer history note in main.rs (#108/#129).
# Windows/Linux never compile Skia; on Windows it conflicts with another ICU
# import library at link time when using the MSVC toolchain (#224).
[target.'cfg(target_os = "macos")'.dependencies]
slint = { version = "1.18.1", features = ["renderer-skia"] }

[build-dependencies]
slint-build = "1.18.1"

# (#picker-input-edit 2026-10-15) Slint 官方测试后端：src/picker/ui_input_test.rs
# 用它真派发指针/键盘事件做取色盘输入行的 UI 级回归。仅测试构建使用。
[dev-dependencies]
i-slint-backend-testing = "1.18.1"

# Embeds assets/mterm.ico into the .exe so Explorer / taskbar / shortcuts
# show the app icon. Windows-only; ignored on other targets.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Win32 COM APIs for the taskbar jump list ("新建窗口" task, see
# src/app/jump_list.rs). 0.58 matches the version already in Cargo.lock via
# transitive deps, keeping the lock diff minimal.
[target.'cfg(windows)'.dependencies]
mimalloc = "0.1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    # (#close-behavior) 真托盘:Shell_NotifyIconW / 消息窗口 / 菜单 / 取图标。
    # 只加 feature —— windows crate 已在依赖里,不引入新 crate。
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    # (#tray-place-scale 2026-09-23) GetDpiForMonitor:弹层 place 时窗口尚未
    # 映射,scale_factor 拿不到目标显示器真实缩放(200% 屏实测首建返回 1.0)。
    "Win32_UI_HiDpi",
    # (#close-exit-fix 2026-09-19) 退出看门狗:ExitProcess 绕过可能挂死的
    # process::exit 清理路径(实测 1 线程僵尸进程)。
    "Win32_System_Threading",
    # (#credential-store 2026-10-13) CredReadW: the built-in RDP client reads
    # `TERMSRV/<host>` out of the Credential Manager when the password field is
    # blank -- the same entry `mstsc` uses. Feature only, no new crate.
    "Win32_Security_Credentials",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# (#fast-profile 2026-09-11) 日常验证用:30 秒级增量构建(依赖仅 opt-level 1、
# 无 LTO、16 codegen units、开 incremental),发布仍走 [profile.release]。
[profile.fast]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true

[profile.dev]
opt-level = 0
# (#icon-svg-migration 2026-10-02) debug=1 -> 0: rustc-LLVM OOM 时（本机内存
# 有限）处理 slint 生成的含 SVG @image-url 代码。debuginfo 是内存大头；
# dev profile 只用于运行验证，调试走 release 符号或按需临时打开。
debug = 0

[profile.dev.package."*"]
opt-level = 1

[patch.crates-io]
# Avoid Slint/winit's AppKit DisplayLink selector on old macOS. The local
# patched backend falls back to timer throttling on macOS only.
#
# The vendored copy carries local additions (FULL_REDRAW_PENDING /
# force_full_redraw_all_windows / set_full_redraw_hold / on_scale_factor_changed,
# see the header comments in vendor/.../lib.rs) that upstream does not have, and
# it pins the rest of the Slint family with `=`, so it MUST be re-synced to the
# matching upstream version on every Slint upgrade — otherwise dependency
# resolution fails outright. Upgrade recipe: extract the pristine crate for the
# new version, three-way merge the 4 patched files
# (lib.rs, winitwindowadapter.rs, frame_throttle.rs, renderer/sw.rs) against the
# previous pristine release, keep both upstream's and our full-redraw hook in
# show().
i-slint-backend-winit = { path = "vendor/i-slint-backend-winit" }

# (#rdp-resize-decompressor 2026-10-13) Local patch of ironrdp-client 0.1.0: the
# upstream Deactivation-Reactivation handler rebuilds the fast-path processor with
# `bulk_decompressor: None`, so after a DisplayControl-driven resize (server sends
# Deactivate All) every compressed FastPath update is fed to the decoder as
# plaintext, decoding fails, and the session dies with a reasonless 已断线.
# The patch recreates the decompressor from the compression type negotiated at
# connect time. Upstream fixed this on master by moving the decompressor into
# `ActiveStage`, but no released ironrdp/ironrdp-client version contains the fix
# (0.17.0 / 0.1.0 are the latest), so upgrade is not an option yet.
# Re-sync recipe on every ironrdp upgrade: re-extract the pristine crate, then
# re-apply the two marked hunks in src/rdp.rs (capture `compression_type` before
# the ActiveStageBuilder; rebuild `BulkCompressor` in the DeactivateAll →
# Finalized branch) and drop the patch entry once upstream ships the fix.
ironrdp-client = { path = "vendor/ironrdp-client" }
