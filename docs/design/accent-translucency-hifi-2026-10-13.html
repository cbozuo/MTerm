<div id="mt-accent-hifi">
<style>
#mt-accent-hifi{
  --w-base:#1b1d23; --w-panel:#23262d; --w-alt:#2a2d35; --w-line:#3a3d46; --w-lstr:#4a4e59;
  --w-t1:#e6e8ee; --w-t2:#b4b9c4; --w-t3:#9196a3; --w-field:#191b21; --w-ctl:#31353e; --ac:#2AACB8;
  --glass-bg:rgba(35,38,45,1); --glass-blur:none; --glass-scrim:rgba(8,10,14,.28); --glass-scrim2:rgba(5,6,9,.74);
  --live:#2AACB8; --live-ink:#101114;
  color-scheme:dark;
  font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  color:var(--w-t1);
}
#mt-accent-hifi button{font-family:inherit}
#mt-accent-hifi .mono{font-family:"Cascadia Mono",Consolas,monospace}
#mt-accent-hifi svg.lucide{width:14px;height:14px;flex:none}

/* ── page head ─────────────────────────────────────────── */
.mt-pagehead{max-width:1030px;margin:0 auto 12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.mt-ptitle{font-size:14px;font-weight:600;color:var(--w-t1)}
.mt-plegend{display:flex;flex-wrap:wrap;align-items:center;gap:13px;font-size:11.5px;color:var(--w-t3)}
.mt-plegend i{font-style:normal;color:var(--ac);margin-right:2px}
.mt-ver{display:inline-flex;gap:2px;padding:2px;background:var(--w-field);border:1px solid var(--w-ctl);border-radius:7px}
.mt-ver button{width:56px;height:22px;border:0;border-radius:5px;background:none;color:var(--w-t3);font-size:11px}
.mt-ver button.on{background:var(--w-alt);color:var(--w-t1)}

/* ── stage & window ────────────────────────────────────── */
.mt-stage{padding:26px 16px;border-radius:14px}
.mt-win{position:relative;max-width:1030px;min-height:720px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;
  background:var(--w-base);border:1px solid var(--w-lstr);border-radius:10px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.mt-win-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid #262931}
.mt-win-head b{font-size:14px;font-weight:600}
.mt-win-x{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:none;color:var(--w-t3)}
.mt-win-x:hover{background:var(--w-alt);color:var(--w-t1)}
.mt-win-body{display:flex;flex:1;min-height:0}

/* nav */
.mt-nav{width:184px;flex:none;padding:10px;border-right:1px solid #262931;display:flex;flex-direction:column;gap:2px}
.mt-navitem{display:flex;align-items:center;gap:9px;padding:7px 10px;border:0;border-radius:6px;background:none;color:var(--w-t2);font-size:12.5px;text-align:left}
.mt-navitem svg.lucide{color:var(--w-t3)}
.mt-navitem:hover{background:#23262d}
.mt-navitem.active{background:var(--w-alt);color:var(--w-t1)}
.mt-navitem.active svg.lucide{color:var(--ac)}

/* content rows */
.mt-content{flex:1;min-width:0;padding:18px 26px 22px}
.mt-intro{margin:0 0 8px;font-size:11.5px;color:var(--w-t3)}
.mt-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:11px 0}
.mt-row-l b{display:block;font-size:13px;font-weight:500;color:var(--w-t1)}
.mt-row-l span{display:block;margin-top:3px;font-size:11px;color:var(--w-t3)}
.mt-hr{height:1px;background:#2c2f37;border:0;margin:0}
.mt-select{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:236px;height:34px;padding:0 12px;
  background:#1d2027;border:1px solid var(--w-ctl);border-radius:8px;color:var(--w-t1);font-size:12.5px}
.mt-select .mt-l{display:flex;align-items:center;gap:8px}
.mt-select svg.lucide{width:12px;height:12px;color:var(--w-t3)}
.mt-dot{width:14px;height:14px;border-radius:50%;flex:none}
.mt-switch{position:relative;width:40px;height:22px;border:0;border-radius:11px;background:#373a44}
.mt-switch span{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:8px;background:#fff;transition:transform .12s ease-out}
.mt-switch[aria-checked="true"]{background:var(--ac)}
.mt-switch[aria-checked="true"] span{transform:translateX(18px)}

/* 滑动分段（强调色 / 通透度共用语言） */
.mt-seg{position:relative;display:flex;gap:2px;width:208px;height:36px;padding:3px;background:var(--w-field);border:1px solid var(--w-ctl);border-radius:10px}
.mt-seg-thumb{position:absolute;top:3px;left:3px;width:calc((100% - 8px)/2);height:calc(100% - 6px);border-radius:7px;background:rgba(42,172,184,.22);transition:transform .18s ease}
.mt-seg button{position:relative;z-index:1;flex:1;min-width:0;border:0;border-radius:7px;background:none;color:var(--w-t2);font-size:12.5px;white-space:nowrap}
.mt-seg button.on{color:var(--ac)}
.mt-seg.seg3{width:216px;height:30px}
.mt-seg.seg3 .mt-seg-thumb{width:calc((100% - 10px)/3)}
.mt-seg.seg3 button{font-size:11.5px}

/* (#fix1) 强调色行：色块仅展示 */
.mt-accentctl{display:flex;align-items:center;gap:10px}
.mt-chip{position:relative;width:46px;height:32px;padding:0;background:var(--w-field);border:1px solid var(--w-lstr);border-radius:8px}
.mt-chip-c{position:absolute;inset:3px;border-radius:5px;display:block;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.mt-guard{margin:9px 0 0;font-size:11px;color:var(--w-t3)}
.mt-guard b{font-weight:500}
.mt-guard .ok{color:#4ec9b0}
.mt-guard .warn{color:#e2a84a}

/* (#fix4) 界面通透度：实时小预览 */
.mt-glassprev{display:flex;align-items:center;gap:16px;margin:10px 0 2px;padding:12px;background:var(--w-panel);border:1px solid #2c2f37;border-radius:10px}
.mt-gp-wall{position:relative;width:320px;height:132px;border-radius:8px;overflow:hidden;flex:none;
  background:linear-gradient(135deg,#252c40,#161b27 55%,#2b2238)}
.mt-gp-blob{position:absolute;border-radius:50%}
.mt-gp-blob.b1{width:104px;height:104px;right:36px;top:12px;background:radial-gradient(circle at 35% 35%,#8a63ff,#4b2fb0)}
.mt-gp-blob.b2{width:66px;height:66px;right:150px;bottom:8px;background:radial-gradient(circle at 35% 35%,#38e0c8,#0e7d6f)}
.mt-gp-blob.b3{width:52px;height:52px;right:22px;bottom:14px;background:radial-gradient(circle at 35% 35%,#ffb648,#c96a12)}
.mt-gp-dialog{position:absolute;right:78px;top:20px;width:138px;height:90px;border-radius:9px;border:1px solid rgba(255,255,255,.25);
  background:var(--glass-bg);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  box-shadow:0 10px 26px rgba(0,0,0,.4);padding:10px 11px;display:flex;flex-direction:column;gap:6px}
.mt-gp-dialog i{display:block;width:40px;height:7px;border-radius:3px;background:rgba(255,255,255,.88)}
.mt-gp-dialog em{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.45)}
.mt-gp-dialog em.short{width:66%}
.mt-gp-dialog u{display:block;width:48px;height:13px;border-radius:6px;background:var(--ac);margin-top:1px;text-decoration:none}
.mt-gp-side{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-width:0}
.mt-gp-cap{margin:0;font-size:11px;color:var(--w-t3);line-height:1.7}
.mt-gp-cap b{color:var(--w-t1);font-weight:600}

/* ── overlays ──────────────────────────────────────────── */
@keyframes mtIn{from{opacity:0;transform:translateY(4px) scale(.985)}to{opacity:1;transform:none}}
@keyframes mtFade{from{opacity:0}to{opacity:1}}
.mt-scrim1{position:absolute;inset:0;z-index:40;background:var(--glass-scrim);animation:mtFade .16s ease-out}
.mt-scrim2{position:absolute;inset:0;z-index:60;background:var(--glass-scrim2);animation:mtFade .16s ease-out}
.mt-pop{position:absolute;z-index:50;max-width:calc(100% - 24px);background:var(--glass-bg);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--w-lstr);border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.55);animation:mtIn .16s ease-out}
.mt-dlg{position:absolute;z-index:70;max-width:calc(100% - 24px);background:var(--glass-bg);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--w-lstr);border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.6);animation:mtIn .16s ease-out}
.mt-draghead{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
.mt-draghead:active{cursor:grabbing}
.mt-draghead .mt-grip{color:var(--w-t3)}
.mt-pop.dragging,.mt-dlg.dragging{box-shadow:0 28px 72px rgba(0,0,0,.7)}

/* (#fix2) 预设弹框 · 新版 */
.mt-popnew{width:656px;padding:14px}
.mt-pop-head{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid #2c2f37}
.mt-pop-head b{font-size:13px;font-weight:600}
.mt-pop-head .mt-grip{width:12px;height:12px}
.mt-pop-head .mt-sp{flex:1}
.mt-stagepill{display:flex;align-items:center;gap:6px;height:24px;padding:0 9px;border:1px solid var(--w-lstr);border-radius:999px;
  font-family:"Cascadia Mono",Consolas,monospace;font-size:10.5px;color:var(--w-t2)}
.mt-stagepill.dirty{border-color:#e2a84a;color:var(--w-t1);box-shadow:0 0 0 3px rgba(226,168,74,.12)}
.mt-stagepill.warn{border-color:#e2a84a;color:var(--w-t1)}
.mt-pop-sub b.warnb{color:#e2a84a;font-weight:600}
.mt-stagepill em{width:12px;height:12px;border-radius:4px;font-style:normal}
.mt-pop-sub{margin:9px 0 10px;font-size:11px;color:var(--w-t3)}
.mt-pop-recents{display:flex;align-items:center;gap:6px;margin-bottom:10px;min-height:20px}
.mt-pop-recents > span{font-size:11px;color:var(--w-t3);margin-right:2px}
.mt-mini{width:20px;height:20px;padding:0;border:1px solid rgba(255,255,255,.14);border-radius:6px}
.mt-mini:hover{transform:scale(1.12)}
.mt-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.mt-sw{position:relative;height:40px;padding:0 7px;border:1px solid rgba(255,255,255,.10);border-radius:8px;text-align:left;
  display:flex;flex-direction:column;justify-content:center;gap:1px;overflow:hidden;
  background-image:linear-gradient(rgba(255,255,255,.13),rgba(255,255,255,0) 45%)}
.mt-sw b{font-size:10px;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt-sw span{font-size:8.5px;opacity:.78}
.mt-sw:hover{transform:translateY(-1px);z-index:1;box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.mt-sw.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(0,0,0,.4)}
.mt-sw.sel::after{content:"✓";position:absolute;right:5px;top:3px;font-size:10px;font-weight:700;color:var(--ink,#fff)}
.mt-pop-foot{display:flex;align-items:stretch;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid #2c2f37}
.mt-cur{display:flex;align-items:stretch;padding:0;border:1px solid var(--w-line);border-radius:10px;background:var(--w-panel);overflow:hidden;transition:border-color .12s ease,box-shadow .12s ease}
.mt-cur:hover{border-color:var(--ac);box-shadow:0 0 0 3px rgba(42,172,184,.14)}
.mt-curwell{position:relative;width:84px;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:0 10px;text-align:left}
.mt-curwell b{font-size:9px;font-weight:600;letter-spacing:.5px;opacity:.85}
.mt-curwell .mono{font-size:10px}
.mt-curhint{display:flex;align-items:center;gap:6px;padding:0 13px;border-left:1px solid var(--w-line);font-size:12px;color:var(--w-t2);transition:color .12s ease}
.mt-cur:hover .mt-curhint{color:var(--w-t1)}
.mt-curhint svg.lucide{width:13px;height:13px}
.mt-curhint .mt-chev{margin-left:2px}
.mt-curhint .mt-chev svg.lucide{width:12px;height:12px}
.mt-sp{flex:1}
.mt-pop-foot .mt-rand,.mt-pop-foot .mt-btn{align-self:center}
.mt-rand{display:flex;align-items:center;gap:6px;height:30px;padding:0 11px;border:1px solid var(--w-lstr);border-radius:8px;background:none;color:var(--w-t2);font-size:12px}
.mt-rand:hover{border-color:var(--ac);color:var(--w-t1)}
.mt-rand svg.lucide{width:13px;height:13px}
.mt-btn{height:30px;padding:0 15px;border:1px solid transparent;border-radius:8px;font-size:12px;
  transition:filter .12s ease,box-shadow .12s ease,transform .12s ease,border-color .12s ease,color .12s ease}
.mt-btn.ghost{border-color:var(--w-lstr);background:none;color:var(--w-t2)}
.mt-btn.ghost:hover{color:var(--w-t1);border-color:#6a6f7c;background:rgba(255,255,255,.03)}
.mt-btn.pri{border:0;font-weight:600}
.mt-btn.pri:hover{filter:brightness(1.12);box-shadow:0 4px 14px rgba(0,0,0,.35),0 0 0 3px rgba(255,255,255,.07)}
.mt-btn.pri:active{filter:brightness(.94);transform:translateY(1px)}

/* 预设弹框 · 旧版对照 */
.mt-popold{width:676px;padding:13px 16px 12px}
.mt-popold-hint{margin:0 0 8px;font-size:11px;color:var(--w-t3)}
.mt-oldgrid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}
.mt-oldcell{position:relative;height:42px;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:0 7px;overflow:hidden;
  border:1px solid rgba(255,255,255,.14);border-radius:6px;text-align:left}
.mt-oldcell b{font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt-oldcell span{font-size:8.5px;opacity:.78}
.mt-oldcell:hover{box-shadow:0 0 0 2px var(--ac)}
.mt-oldfoot{display:flex;gap:12px;margin-top:10px}
.mt-oldfoot .mt-oldcell{width:104px;flex:none}
.mt-oldrand{width:112px;height:42px;border:1px solid var(--w-lstr);border-radius:6px;background:none;color:var(--w-t2);font-size:11.5px}
.mt-oldrand:hover{border-color:var(--ac);color:var(--w-t1)}

/* (#fix3) 调色盘 · 新版 */
.mt-dlgnew{width:462px;padding:16px}
.mt-dlg-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mt-dlg-head b{font-size:13px;font-weight:600}
.mt-dlg-head .mt-grip{width:12px;height:12px}
.mt-dlg-head .mt-sp{flex:1}
.mt-x{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:none;color:var(--w-t3)}
.mt-x:hover{background:var(--w-alt);color:var(--w-t1)}
.mt-x svg.lucide{width:13px;height:13px}
.mt-pv{display:flex;align-items:stretch;gap:10px;margin-bottom:12px;padding:10px 12px;background:rgba(27,29,35,.86);border:1px solid var(--w-ctl);border-radius:9px}
.mt-pv-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;min-width:0}
.mt-pv-item > label{font-size:10px;color:var(--w-t3)}
#mtPvSelChip{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;font-size:11.5px;font-weight:500}
#mtPvSelDot{width:8px;height:8px;border-radius:3px}
#mtPvBtn{padding:5px 13px;border:0;border-radius:6px;font-size:11.5px;font-weight:600}
#mtPvLink{font-size:11.5px;text-decoration:underline;text-underline-offset:2px}
.mt-pickrow{display:flex;gap:12px;margin-bottom:12px}
.mt-wheelwrap{position:relative;width:216px;height:216px;flex:none;user-select:none;-webkit-user-select:none;touch-action:none}
.mt-wheelwrap canvas{display:block;width:216px;height:216px;border-radius:50%}
.mt-wheel-dim{position:absolute;inset:0;border-radius:50%;background:#000;pointer-events:none}
.mt-wh{position:absolute;width:14px;height:14px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);
  box-shadow:0 0 0 1px rgba(0,0,0,.35),0 1px 4px rgba(0,0,0,.4);pointer-events:none}
.mt-bright{position:relative;width:22px;height:216px;flex:none;border:1px solid rgba(255,255,255,.14);border-radius:11px;user-select:none;touch-action:none}
.mt-bthumb{position:absolute;left:2px;right:2px;height:10px;border-radius:5px;background:#fff;border:1px solid rgba(0,0,0,.3);
  transform:translateY(-50%);box-shadow:0 1px 3px rgba(0,0,0,.4);pointer-events:none}
.mt-btip{position:absolute;right:30px;transform:translateY(-50%);padding:3px 9px;background:#111318;border:1px solid var(--w-lstr);
  border-radius:6px;font-size:10.5px;color:var(--w-t1);white-space:nowrap;pointer-events:none;opacity:0;z-index:3;transition:opacity .12s ease}
.mt-btip::after{content:"";position:absolute;right:-4.5px;top:50%;width:7px;height:7px;background:#111318;
  border-right:1px solid var(--w-lstr);border-top:1px solid var(--w-lstr);transform:translateY(-50%) rotate(45deg)}
.mt-btip.show{opacity:1}
.mt-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.mt-hex{height:34px;padding:0 11px;background:var(--w-field);border:1px solid var(--w-ctl);border-radius:8px;color:var(--w-t1);font-size:13px;width:100%}
.mt-hex:focus{outline:2px solid var(--live);outline-offset:-1px;border-color:var(--live)}
.mt-fmt2{position:relative;display:flex;gap:2px;height:32px;padding:2px;background:var(--w-field);border:1px solid var(--w-ctl);border-radius:8px}
.mt-fmt2-thumb{position:absolute;top:2px;left:2px;width:calc((100% - 8px)/3);height:calc(100% - 4px);border-radius:6px;background:var(--live);transition:transform .18s ease,background .12s ease}
.mt-fmt2 button{position:relative;z-index:1;flex:1;min-width:0;border:0;border-radius:6px;background:none;font-size:11px;color:var(--w-t3);transition:color .12s ease}
.mt-fmt2 button.on{color:var(--live-ink);font-weight:600}
.mt-numfield{display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;background:var(--w-field);border:1px solid var(--w-ctl);border-radius:8px;transition:border-color .12s ease}
.mt-numfield:focus-within{border-color:var(--live);outline:2px solid var(--live);outline-offset:-2px}
.mt-numfield > span{width:14px;font-size:10px;color:var(--w-t3)}
.mt-numfield input{flex:1;width:auto;min-width:0;padding:0;border:0;background:none;color:var(--w-t1);font-size:12.5px;text-align:right}
.mt-dlg-guard{margin:0 0 12px;font-size:11px;color:var(--w-t3)}
.mt-dlg-guard .ok{color:#4ec9b0}
.mt-dlg-guard .warn{color:#e2a84a}
.mt-dlg-foot{display:flex;justify-content:flex-end;gap:8px}

/* 调色盘 · 旧版对照 */
.mt-dlgold{width:396px;padding:15px}
.mt-oldprev{height:30px;margin-bottom:10px;border:1px solid var(--w-line);border-radius:5px}
.mt-oldrow{display:flex;gap:6px;margin-bottom:10px}
.mt-ofield{display:flex;align-items:center;gap:4px;width:62px;height:28px;padding:0 7px;background:var(--w-field);border:1px solid var(--w-ctl);border-radius:6px}
.mt-ofield > span{font-size:10px;color:var(--w-t3)}
.mt-ofield input{width:22px;padding:0;border:0;background:none;color:var(--w-t1);font-size:11px}
.mt-ofield.hex{flex:1;min-width:0}
.mt-ofield.hex input{flex:1;width:auto}
#mtOFmt{width:54px;height:28px;border:1px solid var(--w-ctl);border-radius:6px;background:var(--w-field);color:var(--w-t2);font-size:11px}
.mt-wheelwrap.sm{width:186px;height:186px}
.mt-wheelwrap.sm canvas{width:186px;height:186px}
.mt-bright.sm{width:20px;height:186px}

@media (max-width:860px){
  .mt-nav{display:none}
  .mt-win{min-height:640px}
  .mt-popnew,.mt-popold{width:520px}
  .mt-oldgrid{grid-template-columns:repeat(6,minmax(0,1fr))}
  .mt-glassprev{flex-direction:column;align-items:stretch}
}
@media (prefers-reduced-motion:reduce){
  #mt-accent-hifi *{animation:none!important;transition:none!important}
}
</style>

<div class="mt-pagehead">
  <div class="mt-ptitle">设置 · 强调色 + 通透度</div>
  <div class="mt-plegend">
    <span><i>①</i>行内色块仅展示，切换只走滑块</span>

  var GLASS=[

    {bg:'rgba(35,38,45,.16)',blur:'blur(26px) saturate(1.4)',scrim:'rgba(8,10,14,.16)',scrim2:'rgba(5,6,9,.88)',
     cap:'<b>全透（88% 玻璃 + 强遮罩）</b>：最轻盈的一档，壁纸清晰透出；打开弹框时配合更重的遮罩保住可读性。'}

  var st={mode:'custom',applied:'#2AACB8',baseHex:'#2AACB8',sel:'#2AACB8',selRaw:'#2AACB8',glass:0,fmt:'rgb',
          recents:['#2AACB8','#64FFDD','#F44333'],popOpen:false,dlgOpen:false,ver:'new'};
  var work={h:185,s:0.77,v:0.72};

  try{
    var ps=window.zcode&&window.zcode.widgetState&&window.zcode.widgetState.privateContent;
    if(ps&&/^#[0-9a-fA-F]{6}$/.test(ps.applied||'')){
      st.applied=ps.applied;

  function pickRaw(hex){st.selRaw=hex;st.sel=hex;}

  function hsv2rgb(h,s,v){var c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c,r,g,b;
    if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}

  function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h=0;

  function hexNorm(x){x=(x||'').trim();if(x.charAt(0)!=='#')x='#'+x;return /^#[0-9a-fA-F]{6}$/.test(x)?x.toUpperCase():null;}
  function lum(c){var a=c.map(function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});

  function setWorkHex(hex){var c=hex2rgb(hex),h=rgb2hsv(c[0],c[1],c[2]);work.h=h[0];work.s=h[1];work.v=h[2];}

  function drawWheel(cv){

          var rgb=hsv2rgb(h,Math.min(1,r),1);
          d[i]=rgb[0];d[i+1]=rgb[1];d[i+2]=rgb[2];
          d[i+3]=r>0.985?Math.round((1-(r-0.985)/0.015)*255):255;
        }else{d[i+3]=0;}
        i+=4;}}
    ctx.putImageData(img,0,0);
  }

  function buildGrids(){
    var grid=D('mtGrid');
    PRESETS.forEach(function(p){
      var b=document.createElement('button');b.type='button';
      b.className='mt-sw cursor-interaction';b.dataset.h=p[1];
      b.style.background=p[1];b.style.color=inkOn(p[1]);b.style.setProperty('--ink',inkOn(p[1]));
      b.setAttribute('aria-label',p[0]+' '+p[1]);
      b.innerHTML='<b>'+p[0]+'</b><span class="mono">'+p[1]+'</span>';
      b.addEventListener('click',function(){pickRaw(p[1]);render();});   /* 仅选中 */
      grid.appendChild(b);
    });
    var og=D('mtOldGrid');
    OLD_ORDER.forEach(function(name){
      var p=PRESETS.filter(function(q){return q[0]===name;})[0];if(!p)return;
      var b=document.createElement('button');b.type='button';
      b.className='mt-oldcell cursor-interaction';
      b.style.background=p[1];b.style.color=inkOn(p[1]);
      b.innerHTML='<b>'+p[0]+'</b><span class="mono">'+p[1]+'</span>';
      b.addEventListener('click',function(){applyNow(p[1]);});          /* 旧版：点了立即生效 */
      og.appendChild(b);
    });
  }

  function renderRecents(){
    var box=D('mtRecents');box.innerHTML='';
    st.recents.forEach(function(h){
      var b=document.createElement('button');b.type='button';
      b.className='mt-mini cursor-interaction';b.style.background=h;
      b.setAttribute('data-tooltip',h);b.setAttribute('aria-label','最近使用 '+h);
      b.addEventListener('click',function(){pickRaw(h);render();});
      box.appendChild(b);
    });
    D('mtRecentWrap').style.display=st.recents.length?'flex':'none';
  }

  function pushRecent(h){st.recents=[h].concat(st.recents.filter(function(x){return x!==h;})).slice(0,8);renderRecents();}

  /* 旧版语义：点了立即生效并关闭 */
  function applyNow(hex){
    var g=ensure3(hex);
    st.applied=g;st.mode='custom';pushRecent(g);save();render();closePop();
  }

  function placePop(){
    var win=D('mtWin'),pop=D('mtPop');
    var wr=win.getBoundingClientRect();
    pop.hidden=false;pop.style.visibility='hidden';
    var pw=pop.offsetWidth,ph=pop.offsetHeight;
    var left,top;
    if(st.ver==='new'){left=(wr.width-pw)/2;top=(wr.height-ph)/2-8;}
    else{var cr=D('mtChip').getBoundingClientRect();left=cr.right-wr.left-pw;top=cr.bottom-wr.top+6;}
    left=Math.max(12,Math.min(left,wr.width-pw-12));
    top=Math.max(12,Math.min(top,wr.height-ph-12));
    pop.style.left=left+'px';pop.style.top=top+'px';pop.style.visibility='';
  }
  function placeDlg(){
    var win=D('mtWin'),dlg=D('mtDlg');
    var wr=win.getBoundingClientRect();
    dlg.hidden=false;dlg.style.visibility='hidden';
    var dw=dlg.offsetWidth,dh=dlg.offsetHeight;
    dlg.style.left=Math.max(12,(wr.width-dw)/2)+'px';
    dlg.style.top=Math.max(12,Math.min((wr.height-dh)/2,wr.height-dh-12))+'px';
    dlg.style.visibility='';
  }

  function openPop(){st.baseHex=eff();st.sel=st.baseHex;st.selRaw=st.baseHex;st.popOpen=true;D('mtPopScrim').hidden=false;placePop();render();}
  function closePop(){st.popOpen=false;D('mtPop').hidden=true;D('mtPopScrim').hidden=true;}
  function cancelPop(){closePop();render();}
  function openDlg(){setWorkHex(st.sel);st.dlgOpen=true;D('mtDlgScrim').hidden=false;placeDlg();render();}/* 从真实生效色开始调 */
  function closeDlg(){st.dlgOpen=false;D('mtDlg').hidden=true;D('mtDlgScrim').hidden=true;}
  function save(){try{if(window.zcode&&window.zcode.setWidgetState)
    window.zcode.setWidgetState({privateContent:{applied:st.applied,mode:st.mode,recents:st.recents,glass:st.glass}});}catch(e){}}

  function render(){
    var e=eff();
    D('mtChipC').style.background=e;
    var custom=st.mode==='custom';
    D('mtSegThumb').style.transform=custom?'translateX(calc(100% + 2px))':'translateX(0)';
    D('mtSegFollow').classList.toggle('on',!custom);
    D('mtSegCustom').classList.toggle('on',custom);
    var cr=contrast(e);
    D('mtGuard').innerHTML='对比度守卫：<b>'+cr.toFixed(2)+':1</b> · 强调色 '+e+' 对主题面板 '+PANEL_HEX+
      (cr<3?' <span class="warn">⚠ 低于 3:1，已自动调亮</span>':' <span class="ok">✓ 达标</span>');

    /* 弹框：待应用色 */
    /* 药丸 = 调色后的真实生效色（与「应用」按钮一致）；选定原色见左下「选定」色票 */
    var adjPending=ensure3(st.sel);
    D('mtStageDot').style.background=adjPending;
    D('mtStageHex').textContent=adjPending;
    D('mtStagePill').classList.toggle('dirty',selDirty());
    D('mtStagePill').classList.toggle('warn',selDirty()&&adjPending!==st.sel);
    var sub;
    if(selDirty())
      sub='已选择 '+presetName(st.selRaw)+st.selRaw+'（未生效）'
        +(adjPending!==st.sel?' —— 对面板对比度不足 3:1，应用时将自动调亮为 <b class="warnb">'+adjPending+'</b>':'')
        +'；点「应用」生效，取消 / 关闭还原。';
    else
      sub='点选色块仅选中；「应用」后生效，取消 / 关闭还原当前色 '+st.baseHex+'。';
    D('mtPopSub').innerHTML=sub;
    /* 「当前」色票 = 当前选定的颜色（真实生效色），也是调色盘的初始颜色 */
    D('mtCurWell').style.background=st.sel;
    D('mtCurWell').style.color=inkOn(st.sel);
    D('mtCurHex').textContent=st.sel;
    var sws=D('mtGrid').children;
    for(var i=0;i<sws.length;i++)sws[i].classList.toggle('sel',sws[i].dataset.h===st.selRaw);
    var oc=D('mtOldCur');oc.style.background=st.applied;oc.style.color=inkOn(st.applied);
    D('mtOldCurHex').textContent=st.applied;

    /* 调色盘 */
    var hex=curHex(),rgb=hex2rgb(hex);
    ROOT.style.setProperty('--live',hex);
    ROOT.style.setProperty('--live-ink',inkOn(hex));
    D('mtPvSelChip').style.background=rgba(hex,0.18);D('mtPvSelChip').style.color=hex;
    D('mtPvSelDot').style.background=hex;
    D('mtPvBtn').style.background=hex;D('mtPvBtn').style.color=inkOn(hex);
    D('mtPvLink').style.color=hex;
    var brightCss='linear-gradient(to bottom, rgb('+hsv2rgb(work.h,work.s,1).join(',')+'), #000)';
    D('mtBright').style.background=brightCss;D('mtBrightOld').style.background=brightCss;
    D('mtBThumb').style.top=((1-work.v)*100)+'%';D('mtBThumbOld').style.top=((1-work.v)*100)+'%';
    /* 明度联动：色盘整体随明度变暗/变亮（黑色遮罩 = 等效逐像素缩放 V），选点填充当前色 */
    D('mtWheelDim').style.opacity=(1-work.v).toFixed(3);
    D('mtWh').style.background=hex;
    placeHandle(D('mtWh'),108);placeHandle(D('mtWhOld'),93);
    D('mtOldPrev').style.background=hex;
    if(document.activeElement!==D('mtHex'))D('mtHex').value=hex;
    if(document.activeElement!==D('mtOHex'))D('mtOHex').value=hex;
    var labels,vals,oldLabels,oldVals;
    if(st.fmt==='rgb'){labels=['R','G','B'];vals=rgb.map(Math.round);}
    else if(st.fmt==='hsv'){labels=['H','S','V'];vals=[Math.round(work.h),Math.round(work.s*100),Math.round(work.v*100)];}
    else{var l=hsv2hsl(work.h,work.s,work.v);labels=['H','S','L'];vals=[Math.round(l[0]),Math.round(l[1]*100),Math.round(l[2]*100)];}
    if(st.fmt==='rgb'){oldLabels=['R','G','B'];oldVals=vals;}
    else{oldLabels=['H','S','B'];oldVals=[Math.round(work.h),Math.round(work.s*100),Math.round(work.v*100)];}
    for(var k=0;k<3;k++){
      D('mtL'+k).textContent=labels[k];D('mtOL'+k).textContent=oldLabels[k];
      if(document.activeElement!==D('mtN'+k))D('mtN'+k).value=vals[k];
      if(document.activeElement!==D('mtON'+k))D('mtON'+k).value=oldVals[k];
    }
    var cr2=contrast(hex);
    var adjNow=ensure3(hex);
    D('mtDlgGuard').innerHTML='对主题面板 '+PANEL_HEX+' 的对比度 <b>'+cr2.toFixed(2)+':1</b>'+
      (cr2<3?' <span class="warn">⚠ 低于 3:1 —— 应用时将自动调亮为 '+adjNow+'</span>':' <span class="ok">✓ 达标</span>')+
      ' · 「确认」写回弹框，点「应用」后生效';
    var ok=D('mtApply');ok.style.background=hex;ok.style.color=inkOn(hex);ok.textContent='确认';
    var oc2=D('mtOCopy');oc2.style.background=hex;oc2.style.color=inkOn(hex);
    var pok=D('mtPopOk');pok.style.background=adjPending;pok.style.color=inkOn(adjPending);pok.textContent='应用';
  }
  function placeHandle(el,cx){
    var rad=work.h*Math.PI/180,RR=cx-3;
    el.style.left=(cx+Math.cos(rad)*work.s*RR)+'px';
    el.style.top=(cx+Math.sin(rad)*work.s*RR)+'px';
  }

  function bindDrag(head,getEl){
    var sx=0,sy=0,ox=0,oy=0,drag=false;
    head.addEventListener('pointerdown',function(e){
      if(e.target.closest('button'))return;
      drag=true;head.setPointerCapture(e.pointerId);
      var el=getEl(),r=el.getBoundingClientRect(),wr=D('mtWin').getBoundingClientRect();
      sx=e.clientX;sy=e.clientY;ox=r.left-wr.left;oy=r.top-wr.top;
      el.classList.add('dragging');head.classList.add('dragging');
    });
    head.addEventListener('pointermove',function(e){
      if(!drag)return;
      var el=getEl(),wr=D('mtWin').getBoundingClientRect();
      var nx=ox+e.clientX-sx,ny=oy+e.clientY-sy;
      el.style.left=Math.max(12,Math.min(nx,wr.width-el.offsetWidth-12))+'px';
      el.style.top=Math.max(12,Math.min(ny,wr.height-el.offsetHeight-12))+'px';
    });
    function up(){if(!drag)return;drag=false;getEl().classList.remove('dragging');head.classList.remove('dragging');}
    head.addEventListener('pointerup',up);head.addEventListener('pointercancel',up);
  }

  function bindWheel(wrap){
    var cv=wrap.querySelector('canvas');
    function pos(ev){
      var r=cv.getBoundingClientRect();
      var dx=ev.clientX-r.left-r.width/2,dy=ev.clientY-r.top-r.height/2;
      work.h=(Math.atan2(dy,dx)*180/Math.PI+360)%360;
      work.s=Math.min(1,Math.sqrt(dx*dx+dy*dy)/(r.width/2-3));
      render();
    }
    function down(ev){wrap.setPointerCapture(ev.pointerId);pos(ev);
      wrap.addEventListener('pointermove',pos);
      wrap.addEventListener('pointerup',up);wrap.addEventListener('pointercancel',up);}
    function up(){wrap.removeEventListener('pointermove',pos);}
    wrap.addEventListener('pointerdown',down);
  }
  function bindBright(bar,tipId){
    var tip=tipId?D(tipId):null,hideTimer=null;
    function updateTip(){if(tip){tip.style.top=((1-work.v)*100)+'%';tip.textContent='亮度 '+Math.round(work.v*255);}}
    function pos(ev){
      var r=bar.getBoundingClientRect();
      work.v=Math.min(1,Math.max(0,1-(ev.clientY-r.top)/r.height));
      render();updateTip();
    }
    function down(ev){bar.setPointerCapture(ev.pointerId);pos(ev);
      if(tip){clearTimeout(hideTimer);updateTip();tip.classList.add('show');}
      bar.addEventListener('pointermove',pos);
      bar.addEventListener('pointerup',up);bar.addEventListener('pointercancel',up);}
    function up(){bar.removeEventListener('pointermove',pos);
      if(tip)hideTimer=setTimeout(function(){tip.classList.remove('show');},450);}
    bar.addEventListener('pointerdown',down);
    /* 滚轮微调明度 */
    bar.addEventListener('wheel',function(e){
      e.preventDefault();
      work.v=Math.min(1,Math.max(0,work.v+(e.deltaY<0?0.03:-0.03)));
      render();
      if(tip){clearTimeout(hideTimer);updateTip();tip.classList.add('show');
        hideTimer=setTimeout(function(){tip.classList.remove('show');},700);}
    },{passive:false});
  }
  /* 新版数值输入：输入即联动（非法输入等待，失焦还原） */
  function liveNum(idx){
    return function(){
      var n=parseFloat(D('mtN'+idx).value);if(isNaN(n))return;
      if(st.fmt==='rgb'){
        if(n<0||n>255)return;
        var rgb=hsv2rgb(work.h,work.s,work.v);rgb[idx]=Math.round(n);
        var h=rgb2hsv(rgb[0],rgb[1],rgb[2]);work.h=h[0];work.s=h[1];work.v=h[2];
      }else if(st.fmt==='hsv'){
        if(idx===0){if(n<0||n>360)return;work.h=n%360;}
        else{var m=n/100;if(m<0||m>1)return;if(idx===1)work.s=m;else work.v=m;}
      }else{
        if(idx===0){if(n<0||n>360)return;work.h=n%360;}
        else{var m2=n/100;if(m2<0||m2>1)return;
          var c=hsv2hsl(work.h,work.s,work.v);
          if(idx===1)c[1]=m2;else c[2]=m2;
          var b=hsl2hsv(c[0],c[1],c[2]);work.s=b[1];work.v=b[2];}
      }
      render();
    };
  }
  /* 旧版弹框数值输入：change 提交 */
  function bindNum(inp,idx){
    inp.addEventListener('change',function(){
      var n=parseFloat(inp.value);if(isNaN(n)){render();return;}
      var f=st.fmt==='rgb'?'rgb':'hsv';
      if(f==='rgb'){
        var rgb=hsv2rgb(work.h,work.s,work.v);
        rgb[idx]=Math.max(0,Math.min(255,Math.round(n)));
        var h=rgb2hsv(rgb[0],rgb[1],rgb[2]);work.h=h[0];work.s=h[1];work.v=h[2];
      }else{
        if(idx===0)work.h=((n%360)+360)%360;
        else{var m=Math.min(1,Math.max(0,n/100));if(idx===1)work.s=m;else work.v=m;}
      }
      render();
    });
    inp.addEventListener('keydown',function(e){if(e.key==='Enter')inp.blur();});
  }
  function bindHexLive(inp){
    inp.addEventListener('input',function(){
      var v=hexNorm(inp.value);if(v)setWorkHex(v);render();
    });
    inp.addEventListener('keydown',function(e){if(e.key==='Enter')inp.blur();});
  }
  function bindHex(inp){
    inp.addEventListener('change',function(){
      var v=hexNorm(inp.value);if(v)setWorkHex(v);render();
    });
    inp.addEventListener('keydown',function(e){if(e.key==='Enter')inp.blur();});
  }

  function setFmt(f){
    st.fmt=f;
    var order=['rgb','hsv','hsl'];
    D('mtFmtThumb').style.transform='translateX(calc((100% + 2px) * '+order.indexOf(f)+'))';
    var btns=D('mtFmtSeg').querySelectorAll('button');
    for(var i=0;i<btns.length;i++)btns[i].classList.toggle('on',btns[i].getAttribute('data-f')===f);
    D('mtOFmt').textContent=f==='rgb'?'RGB':'HSB';
    render();
  }
  function setGlass(g){
    st.glass=g;var c=GLASS[g];
    ROOT.style.setProperty('--glass-bg',c.bg);
    ROOT.style.setProperty('--glass-blur',c.blur);
    ROOT.style.setProperty('--glass-scrim',c.scrim);
    ROOT.style.setProperty('--glass-scrim2',c.scrim2);
    D('mtGlassThumb').style.transform='translateX(calc((100% + 2px) * '+g+'))';
    var btns=D('mtGlassSeg').querySelectorAll('button');
    for(var i=0;i<btns.length;i++)btns[i].classList.toggle('on',+btns[i].getAttribute('data-g')===g);
    D('mtGpCap').innerHTML=c.cap;
  }

  buildGrids();renderRecents();setWorkHex(st.applied);setGlass(st.glass);setFmt('rgb');
  drawWheel(D('mtWheel'));drawWheel(D('mtWheelOld'));

  /* 强调色：滑块是唯一切换入口；色块仅展示 */
  D('mtSegFollow').addEventListener('click',function(){st.mode='follow';closePop();save();render();});
  D('mtSegCustom').addEventListener('click',function(){st.mode='custom';openPop();render();});
  /* 弹框：应用才生效；取消 / ✕ / 空白 / Esc 还原 */
  D('mtPopOk').addEventListener('click',function(){
    if(selDirty()){
      st.applied=ensure3(st.sel);st.mode='custom';pushRecent(st.applied);save();
    }
    closePop();render();
  });
  D('mtPopCancel').addEventListener('click',cancelPop);
  D('mtPopX').addEventListener('click',cancelPop);
  D('mtPopScrim').addEventListener('click',cancelPop);
  D('mtRand').addEventListener('click',function(){pickRaw(randHex());render();});
  D('mtOldRand').addEventListener('click',function(){pickRaw(randHex());render();});
  D('mtCurCard').addEventListener('click',openDlg);
  D('mtOldCur').addEventListener('click',function(){st.selRaw=st.applied;st.sel=st.applied;openDlg();});
  D('mtCancel').addEventListener('click',closeDlg);
  D('mtDlgX').addEventListener('click',closeDlg);
  D('mtDlgScrim').addEventListener('click',closeDlg);
  /* 调色盘「确认」= 写回弹框待确认（不直接生效） */
  D('mtApply').addEventListener('click',function(){
    pickRaw(curHex());
    closeDlg();render();
  });
  D('mtOCopy').addEventListener('click',function(){st.selRaw=curHex();st.sel=curHex();closeDlg();render();});
  var fbtns=D('mtFmtSeg').querySelectorAll('button');
  for(var fi=0;fi<fbtns.length;fi++)(function(btn){
    btn.addEventListener('click',function(){setFmt(btn.getAttribute('data-f'));});
  })(fbtns[fi]);
  D('mtOFmt').addEventListener('click',function(){setFmt(st.fmt==='rgb'?'hsv':'rgb');});
  for(var ni=0;ni<3;ni++){
    D('mtN'+ni).addEventListener('input',liveNum(ni));
    D('mtN'+ni).addEventListener('change',function(){render();});
    bindNum(D('mtON'+ni),ni);
  }
  bindHexLive(D('mtHex'));bindHex(D('mtOHex'));
  bindWheel(D('mtWheelWrap'));bindWheel(D('mtWheelWrapOld'));
  bindBright(D('mtBright'),'mtBTip');bindBright(D('mtBrightOld'));
  bindDrag(D('mtPopDrag'),function(){return D('mtPop');});
  bindDrag(D('mtDlgDrag'),function(){return D('mtDlg');});

  D('mtFollowSwitch').addEventListener('click',function(){
    var b=D('mtFollowSwitch');
    b.setAttribute('aria-checked',b.getAttribute('aria-checked')==='true'?'false':'true');
  });
  var gbtns=D('mtGlassSeg').querySelectorAll('button');
  for(var gi=0;gi<gbtns.length;gi++)(function(btn){
    btn.addEventListener('click',function(){setGlass(+btn.getAttribute('data-g'));save();});
  })(gbtns[gi]);

  function setVer(v){
    st.ver=v;
    D('mtPopNew').hidden=v!=='new';D('mtPopOld').hidden=v!=='old';
    D('mtDlgNew').hidden=v!=='new';D('mtDlgOld').hidden=v!=='old';
    D('mtVerNew').classList.toggle('on',v==='new');
    D('mtVerOld').classList.toggle('on',v==='old');
    if(st.popOpen)placePop();
    if(st.dlgOpen)placeDlg();
  }
  D('mtVerNew').addEventListener('click',function(){setVer('new');});
  D('mtVerOld').addEventListener('click',function(){setVer('old');});

  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    if(st.dlgOpen){closeDlg();render();}
    else if(st.popOpen){cancelPop();}
  });

  window.addEventListener('resize',function(){if(st.popOpen)placePop();if(st.dlgOpen)placeDlg();});
  render();
  try{if(window.lucide&&lucide.createIcons)lucide.createIcons();}catch(e){}
})();
</script>
</div>
