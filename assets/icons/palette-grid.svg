  <rect x="13.5" y="13.5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  <rect x="6" y="6" width="2" height="2" rx="0.5" fill="currentColor"/>
