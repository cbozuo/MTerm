<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- MTerm logo · 窗内左上角 / 应用图标统一源图（黑底白 M 徽章） -->
  <!-- 深色主题窗内使用时，可在 UI 层外包 Rectangle 加 0.5px #ffffff3d 亮边（仅 is-dark） -->
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#2a2a33"/>
      <stop offset="1" stop-color="#121218"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- M 墨迹盒 380×380（512 的 74%）；四边留白统一 66px（13%），笔宽 100 -->
  <polyline points="116,446 116,96 256,286 396,96 396,446" fill="none" stroke="#f4f5f7"
    stroke-width="100" stroke-linejoin="miter" stroke-miterlimit="1.9" stroke-linecap="butt"/>
</svg>
